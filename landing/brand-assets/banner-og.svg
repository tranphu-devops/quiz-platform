    <rect x="0" y="0" width="180" height="180" rx="40" fill="url(#mark)"/>
    <rect x="45" y="28" width="90" height="115" rx="14" fill="#202331" opacity="0.92"/>
    <line x1="61" y1="58" x2="119" y2="58" stroke="#c084fc" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
    <line x1="61" y1="80" x2="94" y2="80" stroke="#c084fc" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <path d="M61 112l18 16 30-37" stroke="#c084fc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="410" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" text-anchor="middle" fill="#ffffff">NovaQuiz</text>

