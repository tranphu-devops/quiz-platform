<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO:HEAD — title/description/canonical/hreflang/OG/JSON-LD are injected
       per language by scripts/build-landing-i18n.js. Do not hand-edit there. -->
  <!-- INCLUDE:head -->
  <style>
    /* INCLUDE:chrome-css */

    /* Darker than the shared tokens: these two are used as *text* colours on a
       tinted panel, where #22c55e/#ef4444 fall under 3:1. */
    :root { --success: #16a34a; --danger: #dc2626; }

    .page-hero { padding: 4.5rem 1.5rem 3rem; text-align: center; background: linear-gradient(165deg, #f0f0ff 0%, #ede6ff 35%, #f2edff 65%, #fdf4ff 100%); }
    .page-hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; letter-spacing: -.05em; margin-bottom: 1rem; }
    .page-hero p { font-size: 1.05rem; color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.75; }

    .wrap { max-width: 620px; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; }
    .contact-card { background: white; border-radius: var(--radius); border: 1.5px solid var(--border); padding: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,.06); }

    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: .84rem; font-weight: 700; margin-bottom: .4rem; }
    .field input, .field textarea {
      width: 100%; padding: .7rem .9rem; border-radius: 10px; border: 1.5px solid var(--border);
      font-family: inherit; font-size: .92rem; color: var(--text); background: var(--bg);
      transition: border-color .15s, background .15s;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); background: white; }
    .field textarea { resize: vertical; min-height: 130px; }
    .field .hint { font-size: .74rem; color: var(--muted); margin-top: .3rem; }

    .submit-btn {
      width: 100%; padding: .85rem; border: none; border-radius: 10px; font-size: .95rem; font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; cursor: pointer;
      transition: opacity .15s, transform .15s; box-shadow: 0 6px 20px rgba(86,37,209,.32);
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    .form-msg { margin-top: 1rem; padding: .75rem 1rem; border-radius: 10px; font-size: .86rem; font-weight: 600; display: none; }
    .form-msg.success { display: block; background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
    .form-msg.error { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

    .alt-contact { margin-top: 2rem; text-align: center; font-size: .86rem; color: var(--muted); }
    .alt-contact a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .alt-contact a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- INCLUDE:header -->

<div class="page-hero">
  <h1 data-i18n="hero.title">Contact us</h1>
  <p data-i18n="hero.sub">Have a question, feedback or want to partner up? Send the NovaQuiz team a message — we'll get back to you as soon as we can.</p>
</div>

<div class="wrap">
  <div class="contact-card">
    <form id="contact-form" novalidate>
      <div class="field">
        <label for="name" data-i18n="form.name">Full name</label>
        <input type="text" id="name" name="name" maxlength="100" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email" data-i18n="form.email">Email</label>
        <input type="email" id="email" name="email" maxlength="200" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="message" data-i18n="form.message">Message</label>
        <textarea id="message" name="message" maxlength="4000" required></textarea>
        <div class="hint" data-i18n="form.hint">Up to 4000 characters.</div>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn" data-i18n="form.submit">Send message</button>
      <div class="form-msg" id="form-msg" role="status"></div>
    </form>
  </div>

  <p class="alt-contact">
    <span data-i18n="alt.text">Or email us directly at</span> <a href="mailto:tranphu.dev@gmail.com">tranphu.dev@gmail.com</a>
  </p>
</div>

<!-- INCLUDE:footer -->

<script>
  var I18N = {
    en: {
      'meta.title': 'Contact — NovaQuiz',
      'meta.description': 'Contact the NovaQuiz team — send questions, feedback or partnership requests.',
      'hero.title': 'Contact us',
      'hero.sub': "Have a question, feedback or want to partner up? Send the NovaQuiz team a message — we'll get back to you as soon as we can.",
      'form.name': 'Full name',
      'form.email': 'Email',
      'form.message': 'Message',
      'form.hint': 'Up to 4000 characters.',
      'form.submit': 'Send message',
      'form.sending': 'Sending...',
      'form.success': 'Message sent successfully! We will get back to you as soon as we can.',
      'form.error': 'Failed to send message, please try again.',
      'form.network': 'Could not reach the server, please try again later.',
      'alt.text': 'Or email us directly at'
    },
    vi: {
      'meta.title': 'Liên hệ — NovaQuiz',
      'meta.description': 'Liên hệ đội ngũ NovaQuiz — gửi câu hỏi, góp ý hoặc đề nghị hợp tác.',
      'hero.title': 'Liên hệ với chúng tôi',
      'hero.sub': 'Có câu hỏi, góp ý hay muốn hợp tác? Gửi tin nhắn cho đội ngũ NovaQuiz — chúng tôi sẽ phản hồi sớm nhất có thể.',
      'form.name': 'Họ tên',
      'form.email': 'Email',
      'form.message': 'Nội dung',
      'form.hint': 'Tối đa 4000 ký tự.',
      'form.submit': 'Gửi liên hệ',
      'form.sending': 'Đang gửi...',
      'form.success': 'Đã gửi liên hệ thành công! Chúng tôi sẽ phản hồi sớm nhất có thể.',
      'form.error': 'Gửi liên hệ thất bại, vui lòng thử lại.',
      'form.network': 'Không thể kết nối máy chủ, vui lòng thử lại sau.',
      'alt.text': 'Hoặc email trực tiếp tới'
    },
    ja: {
      'meta.title': 'お問い合わせ — NovaQuiz',
      'meta.description': 'NovaQuiz チームへのお問い合わせ — ご質問、ご意見、提携のご相談をお送りください。',
      'hero.title': 'お問い合わせ',
      'hero.sub': 'ご質問、ご意見、または提携をご希望ですか？NovaQuiz チームにメッセージをお送りください — できるだけ早くご返信いたします。',
      'form.name': 'お名前',
      'form.email': 'メールアドレス',
      'form.message': 'メッセージ',
      'form.hint': '最大 4000 文字。',
      'form.submit': '送信する',
      'form.sending': '送信中...',
      'form.success': 'メッセージを送信しました！できるだけ早くご返信いたします。',
      'form.error': '送信に失敗しました。もう一度お試しください。',
      'form.network': 'サーバーに接続できませんでした。しばらくしてからもう一度お試しください。',
      'alt.text': 'または直接メールでお問い合わせください：'
    }
  };
</script>

<!-- RUNTIME-STRINGS: form.sending, form.submit, form.success, form.error, form.network -->
<script>
  var form = document.getElementById('contact-form');
  var btn = document.getElementById('submit-btn');
  var msg = document.getElementById('form-msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.className = 'form-msg';
    msg.textContent = '';

    var payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      message: document.getElementById('message').value.trim()
    };

    btn.disabled = true;
    btn.textContent = t('form.sending');

    fetch('/api/notifications/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (result.ok) {
          msg.className = 'form-msg success';
          msg.textContent = t('form.success');
          form.reset();
        } else {
          msg.className = 'form-msg error';
          msg.textContent = t('form.error');
        }
      })
      .catch(function () {
        msg.className = 'form-msg error';
        msg.textContent = t('form.network');
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = t('form.submit');
      });
  });
</script>

</body>
</html>
