events {}

http {
  include       /etc/nginx/mime.types;
  client_max_body_size 10m;

  # ── Rate limit zones ─────────────────────────────────────────────────
  # General API: 2 req/s per IP (burst 30)
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=2r/s;
  # Submission service: 20 req/min — exam start + submit are infrequent
  limit_req_zone $binary_remote_addr zone=api_submissions:10m rate=20r/m;
  # Auth endpoints: 20 req/min — prevents brute force
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;

  limit_req_status 429;

  # Every proxied location sets `X-Forwarded-For $remote_addr` — overwriting,
  # never `$proxy_add_x_forwarded_for`, which appends whatever the client sent
  # and would let anyone forge the key that both these zones and the services'
  # own per-IP limiters run on. Fastify's trustProxy reads X-Forwarded-For and
  # ignores X-Real-IP, so before this every backend saw one IP (nginx's) and
  # its "300 requests per minute per IP" was really 300 per minute in total.

  # ── Landing language negotiation ─────────────────────────────────────
  # The landing page ships as three pre-rendered files (/ = en, /vi, /ja,
  # generated by scripts/build-landing-i18n.js). `/` redirects a visitor to
  # their language when we can infer it, and otherwise stays English.
  #
  # Country comes from Cloudflare's CF-IPCountry header, which is only sent
  # when "IP Geolocation" is enabled on the zone. If it is off — or the
  # request did not come through Cloudflare — the variable is empty, no
  # redirect happens, and everyone simply gets English. Failing into
  # x-default is the intended degradation, not a bug to chase.
  map $http_cf_ipcountry $geo_lang {
    default  "";
    VN       "vi";
    JP       "ja";
  }

  # The language switcher sets this cookie before navigating. Once a visitor
  # has chosen, geo must never override them — otherwise picking "English"
  # from /vi inside Vietnam bounces straight back to /vi.
  map $cookie_nqlang $lang_chosen {
    default  1;
    ""       0;
  }

  # Crawlers are exempt. They fetch from a small set of (mostly US) IPs, so a
  # geo redirect would pin every one of them to a single language and leave
  # /vi and /ja permanently unindexed — the exact opposite of why the pages
  # were split. Google explicitly advises against redirecting on inferred
  # locale; letting bots reach all three URLs is what makes hreflang work.
  map $http_user_agent $is_crawler {
    default  0;
    "~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|coccocbot|applebot|facebookexternalhit|twitterbot|linkedinbot|telegrambot|whatsapp|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|perplexitybot|ccbot|bytespider)"  1;
  }

  map "$is_crawler$lang_chosen$geo_lang" $landing_redirect {
    default  "";
    "00vi"   "/vi";
    "00ja"   "/ja";
  }

  upstream gotrue      { server gotrue:9999; }
  upstream users       { server user-service:3002; }
  upstream exams       { server exam-service:3003; }
  upstream submissions { server submission-service:3004; }
  upstream interactions { server interaction-service:3005; }
  upstream generator   { server generator-service:3006; }
  upstream notifications { server notification-service:3007; }
  upstream frontend    { server frontend:3000; }

  # ── Landing page (novaquiz.net) — HTTPS ──────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name novaquiz.net www.novaquiz.net;

    include /opt/nginx/cloudflare.conf;
    ssl_certificate     /opt/nginx/ssl/novaquiz.net.pem;
    ssl_certificate_key /opt/nginx/ssl/novaquiz.net.key;

    location = / {
      # 302, never 301: the target depends on the visitor, so a permanent
      # redirect would be cached and pin them to one language for good.
      if ($landing_redirect) {
        return 302 $landing_redirect;
      }
      # Keep an intermediary from caching one visitor's variant for everyone.
      # Only `/` needs this; /vi and /ja are unconditional and stay cacheable.
      add_header Cache-Control "private, max-age=0, must-revalidate" always;
      root /var/www/landing;
      try_files /index.html =404;
    }

    location = /vi {
      root /var/www/landing;
      try_files /vi.html =404;
    }

    location = /ja {
      root /var/www/landing;
      try_files /ja.html =404;
    }

    location = /brand {
      root /var/www/landing;
      try_files /brand.html =404;
    }

    location = /contact {
      root /var/www/landing;
      try_files /contact.html =404;
    }

    location = /robots.txt  { root /var/www/landing; }
    location = /sitemap.xml { root /var/www/landing; }
    location = /llms.txt    { root /var/www/landing; }

    location /brand-assets/ {
      root /var/www/landing;
    }

    location /auth/ {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass http://gotrue/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://users/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/exams/exams/internal/       { return 403; }
    location /api/exams/collections/internal/ { return 403; }

    location /api/exams/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://exams/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/submissions/ {
      limit_req zone=api_submissions burst=10 nodelay;
      proxy_pass http://submissions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/interactions/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://interactions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/generator/ {
      client_max_body_size 20m;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://generator/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/notifications/internal/ { return 403; }

    location /api/notifications/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://notifications/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      # adapter-node builds event.url from these (ADDRESS_HEADER/PROTOCOL_HEADER/
      # HOST_HEADER in docker-compose.yml). Without them the server-rendered
      # public pages would see http://localhost:3000 as their own origin.
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }

  # HTTP → HTTPS redirect for novaquiz.net
  server {
    listen 80;
    listen [::]:80;
    server_name novaquiz.net www.novaquiz.net;
    return 301 https://$host$request_uri;
  }

  # ── External app vhosts ──────────────────────────────────────────
  # Drop .conf files into /opt/nginx/ on the host to add new domains.
  include /opt/nginx/*.conf;

  # ── App (app.novaquiz.net / localhost / default) ──────────────────
  server {
    listen 80 default_server;

    location /auth/ {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass http://gotrue/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://users/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/exams/exams/internal/       { return 403; }
    location /api/exams/collections/internal/ { return 403; }

    location /api/exams/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://exams/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/submissions/ {
      limit_req zone=api_submissions burst=10 nodelay;
      proxy_pass http://submissions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/interactions/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://interactions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/generator/ {
      # Document uploads (PDF/DOCX) run larger than images, and LLM
      # generation + sequential question import can take well past nginx's
      # default 60s proxy timeouts.
      client_max_body_size 20m;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://generator/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/notifications/internal/ { return 403; }

    location /api/notifications/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://notifications/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      # adapter-node builds event.url from these (ADDRESS_HEADER/PROTOCOL_HEADER/
      # HOST_HEADER in docker-compose.yml). Without them the server-rendered
      # public pages would see http://localhost:3000 as their own origin.
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
