events {}

http {
  include       /etc/nginx/mime.types;
  client_max_body_size 10m;

  # ── Rate limit zones ─────────────────────────────────────────────────
  # General API: 2 req/s per IP (burst 30)
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=2r/s;
  # Submission service: 20 req/min — exam start + submit are infrequent
  limit_req_zone $binary_remote_addr zone=api_submissions:10m rate=20r/m;
  # Auth endpoints: 20 req/min — prevents brute force
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;

  limit_req_status 429;

  upstream gotrue      { server gotrue:9999; }
  upstream users       { server user-service:3002; }
  upstream exams       { server exam-service:3003; }
  upstream submissions { server submission-service:3004; }
  upstream interactions { server interaction-service:3005; }
  upstream generator   { server generator-service:3006; }
  upstream notifications { server notification-service:3007; }
  upstream frontend    { server frontend:3000; }

  # ── Landing page (novaquiz.net) — HTTPS ──────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name novaquiz.net www.novaquiz.net;

    include /opt/nginx/cloudflare.conf;
    ssl_certificate     /opt/nginx/ssl/novaquiz.net.pem;
    ssl_certificate_key /opt/nginx/ssl/novaquiz.net.key;

    location = / {
      root /var/www/landing;
      try_files /index.html =404;
    }

    location = /brand {
      root /var/www/landing;
      try_files /brand.html =404;
    }

    location = /contact {
      root /var/www/landing;
      try_files /contact.html =404;
    }

    location /brand-assets/ {
      root /var/www/landing;
    }

    location /auth/ {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass http://gotrue/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://users/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/exams/exams/internal/       { return 403; }
    location /api/exams/collections/internal/ { return 403; }

    location /api/exams/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://exams/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/submissions/ {
      limit_req zone=api_submissions burst=10 nodelay;
      proxy_pass http://submissions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/interactions/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://interactions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/generator/ {
      client_max_body_size 20m;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://generator/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notifications/internal/ { return 403; }

    location /api/notifications/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://notifications/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # HTTP → HTTPS redirect for novaquiz.net
  server {
    listen 80;
    listen [::]:80;
    server_name novaquiz.net www.novaquiz.net;
    return 301 https://$host$request_uri;
  }

  # ── External app vhosts ──────────────────────────────────────────
  # Drop .conf files into /opt/nginx/ on the host to add new domains.
  include /opt/nginx/*.conf;

  # ── App (app.novaquiz.net / localhost / default) ──────────────────
  server {
    listen 80 default_server;

    location /auth/ {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass http://gotrue/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Branded HTML template GoTrue fetches over the internal network when
    # sending auth emails (e.g. GOTRUE_MAILER_TEMPLATES_MAGIC_LINK).
    location /mail-templates/ {
      alias /var/www/mail-templates/;
    }

    location /api/users/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://users/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/exams/exams/internal/       { return 403; }
    location /api/exams/collections/internal/ { return 403; }

    location /api/exams/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://exams/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/submissions/ {
      limit_req zone=api_submissions burst=10 nodelay;
      proxy_pass http://submissions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/interactions/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://interactions/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/generator/ {
      # Document uploads (PDF/DOCX) run larger than images, and LLM
      # generation + sequential question import can take well past nginx's
      # default 60s proxy timeouts.
      client_max_body_size 20m;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://generator/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notifications/internal/ { return 403; }

    location /api/notifications/ {
      limit_req zone=api_general burst=30 nodelay;
      proxy_pass http://notifications/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
