<!doctype html>
<html lang="%nq.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5625d1" />
    <!-- Site-wide description / og:* / twitter:*, substituted by the publicSeo
         hook in src/hooks.server.js. They stay in this static shell because the
         app routes are ssr:false — nothing they put in <svelte:head> exists
         before hydration, and the crawlers that build link previews do not run
         JavaScript. On the public SEO pages the hook replaces this with an
         empty string instead, because <svelte:head> appends rather than
         replaces and those pages emit their own. -->
    %nq.defaultmeta%
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    %sveltekit.head%
    <!-- Umami analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="48416adf-94dc-46a2-843c-6a98cb044701"></script>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('quiz-theme') || 'light'
      } catch {}
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
